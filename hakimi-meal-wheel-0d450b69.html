<!DOCTYPE html>
<html lang="zh-CN">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>干饭轮盘</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fff6ec 0%, #ffe8d6 55%, #ffdcc5 100%);
    color: #4a3525;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px 40px;
    overflow-x: hidden;
    position: relative;
  }
  .app {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .header {
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: #fff;
    color: #ff7b54;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    box-shadow: 0 3px 10px rgba(255, 123, 84, 0.15);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    color: #4a3525;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 13px;
    color: #8c6b53;
    margin-top: 4px;
  }
  .wheel-stage {
    position: relative;
    width: min(82vw, 330px);
    height: min(82vw, 330px);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 6px 0;
  }
  .wheel-rim {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: linear-gradient(145deg, #fffaf5, #f7d9c4);
    box-shadow: 0 14px 32px rgba(138, 84, 48, 0.18), inset 0 2px 6px rgba(255, 255, 255, 0.9);
    border: 4px solid #fff;
  }
  canvas {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
  }
  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    width: 36px;
    height: 44px;
    filter: drop-shadow(0 4px 6px rgba(120, 50, 20, 0.25));
    transition: transform 0.08s ease;
  }
  .pointer.tick {
    transform: translateX(-50%) rotate(-12deg);
  }
  .hub {
    position: absolute;
    z-index: 4;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(145deg, #ffffff, #fff0e5);
    border: 4px solid #ff8c61;
    box-shadow: 0 6px 14px rgba(160, 80, 40, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    user-select: none;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .hub:active {
    transform: scale(0.92);
  }
  .result-card {
    width: 100%;
    min-height: 82px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 14px 18px;
    box-shadow: 0 8px 24px rgba(155, 95, 55, 0.1);
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .result-card.pop {
    transform: scale(1.03);
  }
  .result-title {
    font-size: 13px;
    color: #9c7a62;
    margin-bottom: 4px;
  }
  .result-value {
    font-size: 22px;
    font-weight: 800;
    color: #ff6b4a;
  }
  .result-note {
    font-size: 12px;
    color: #7d5f49;
    margin-top: 4px;
  }
  .spin-btn {
    width: 100%;
    padding: 16px 24px;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #ff8a5c 0%, #ff5e57 100%);
    border: none;
    border-radius: 999px;
    box-shadow: 0 10px 22px rgba(255, 94, 87, 0.34), inset 0 2px 2px rgba(255, 255, 255, 0.35);
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
  }
  .spin-btn:active:not(:disabled) {
    transform: translateY(2px) scale(0.98);
    box-shadow: 0 5px 12px rgba(255, 94, 87, 0.28);
  }
  .spin-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 2px;
  }
  .chip {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.65);
    color: #7a5c46;
    border: 1px solid rgba(255, 180, 140, 0.4);
  }
  .chip.active {
    background: #ff7b54;
    color: #fff;
    border-color: #ff7b54;
    font-weight: 700;
  }
  .signature {
    position: fixed;
    right: 12px;
    bottom: 10px;
    font-size: 11px;
    color: rgba(110, 80, 60, 0.55);
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="badge">🐾 今日菜单决定器</div>
      <h1>干饭轮盘</h1>
      <p class="subtitle">转到哪个吃哪个，绝不反悔喵</p>
    </div>

    <div class="wheel-stage">
      <div class="wheel-rim"></div>
      <svg class="pointer" id="pointer" viewBox="0 0 36 44" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 42 C16 42 4 21 4 13 C4 5.8 10.2 2 18 2 C25.8 2 32 5.8 32 13 C32 21 20 42 18 42 Z" fill="#ff5e57" stroke="#ffffff" stroke-width="3"/>
        <circle cx="18" cy="13" r="4.5" fill="#ffffff"/>
      </svg>
      <canvas id="wheel"></canvas>
      <div class="hub" id="hub" title="点我开转">🐱</div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-title" id="resultTitle">准备好了吗？</div>
      <div class="result-value" id="resultValue">点击下方开转！</div>
      <div class="result-note" id="resultNote">六个选项已就位，听天由命喵～</div>
    </div>

    <button class="spin-btn" id="spinBtn">开始干饭！</button>

    <div class="chips" id="chips"></div>
  </div>

  <div class="signature">by 哈基米</div>

<script>
(() => {
  const items = [
    { name: 'すき家', color: '#FF9E7D', note: '大碗牛丼加颗温泉蛋，吸溜～' },
    { name: '松屋', color: '#FFD166', note: '牛肉饭配热乎味噌汤，稳稳的幸福喵！' },
    { name: '拉面', color: '#FF85A1', note: '嗦一口热腾腾的面，汤都要喝光光！' },
    { name: '便利店饭团', color: '#8FD9A8', note: '快速又省心，挑个金枪鱼蛋黄酱喵～' },
    { name: '食堂', color: '#7EC8E3', note: '冲呀！祈祷今天打饭阿姨手不抖～' },
    { name: '咖喱', color: '#C3A6FF', note: '浓香咖喱配米饭，本喵都想舔碗底！' }
  ];

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const hub = document.getElementById('hub');
  const pointer = document.getElementById('pointer');
  const resultCard = document.getElementById('resultCard');
  const resultTitle = document.getElementById('resultTitle');
  const resultValue = document.getElementById('resultValue');
  const resultNote = document.getElementById('resultNote');
  const chipsEl = document.getElementById('chips');

  const sliceCount = items.length;
  const sliceAngle = (Math.PI * 2) / sliceCount;

  let currentAngle = -Math.PI / 2;
  let isSpinning = false;
  let audioCtx = null;

  items.forEach((item, idx) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = item.name;
    chip.dataset.idx = idx;
    chipsEl.appendChild(chip);
  });

  function playTick(freq = 580, duration = 0.03) {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function playWin() {
    playTick(660, 0.09);
    setTimeout(() => playTick(880, 0.14), 90);
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const size = rect.width || 300;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawWheel(size);
  }

  function drawWheel(size) {
    const s = size || canvas.getBoundingClientRect().width || 300;
    const cx = s / 2;
    const cy = s / 2;
    const radius = s / 2 - 2;

    ctx.clearRect(0, 0, s, s);

    for (let i = 0; i < sliceCount; i++) {
      const start = currentAngle + i * sliceAngle;
      const end = start + sliceAngle;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = items[i].color;
      ctx.fill();

      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#fff9f4';
      ctx.stroke();

      const mid = start + sliceAngle / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(mid);

      ctx.fillStyle = '#4a3525';
      const fontSize = Math.max(13, Math.round(s * 0.052));
      ctx.font = '800 ' + fontSize + 'px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(items[i].name, radius * 0.63, 0);
      ctx.restore();
    }
  }

  function getWinnerIndex(angle) {
    const twoPi = Math.PI * 2;
    const pointerAngle = 1.5 * Math.PI;
    const normAngle = ((angle % twoPi) + twoPi) % twoPi;
    const local = ((pointerAngle - normAngle) % twoPi + twoPi) % twoPi;
    return Math.floor(local / sliceAngle) % sliceCount;
  }

  function highlightChip(idx) {
    const all = chipsEl.querySelectorAll('.chip');
    all.forEach((el, i) => el.classList.toggle('active', i === idx));
  }

  function spin() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = '命运转动中...';
    resultCard.classList.remove('pop');
    resultTitle.textContent = '咕噜咕噜...';
    resultValue.textContent = '会是谁呢？';
    resultNote.textContent = '爪爪祈祷中 🐾';
    highlightChip(-1);

    const startAngle = currentAngle;
    const extraTurns = 6 + Math.random() * 4;
    const targetDelta = extraTurns * Math.PI * 2 + Math.random() * Math.PI * 2;
    const duration = 4200;
    const startTime = performance.now();
    let lastIdx = getWinnerIndex(currentAngle);

    function frame(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3.6);
      currentAngle = startAngle + targetDelta * eased;
      drawWheel();

      const curIdx = getWinnerIndex(currentAngle);
      if (curIdx !== lastIdx) {
        lastIdx = curIdx;
        playTick(520 + (curIdx % 3) * 40, 0.025);
        pointer.classList.add('tick');
        setTimeout(() => pointer.classList.remove('tick'), 70);
      }

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.textContent = '再转一次！';
        const winnerIdx = getWinnerIndex(currentAngle);
        const winner = items[winnerIdx];
        highlightChip(winnerIdx);
        resultTitle.textContent = '就决定是你啦！';
        resultValue.textContent = '🍽️ ' + winner.name;
        resultNote.textContent = winner.note;
        resultCard.classList.add('pop');
        playWin();
      }
    }

    requestAnimationFrame(frame);
  }

  spinBtn.addEventListener('click', spin);
  hub.addEventListener('click', spin);
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
})();
</script>
</body>
</html>
